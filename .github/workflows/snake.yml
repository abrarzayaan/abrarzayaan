name: Generate Snake Contribution Animation

on:
  schedule:
    # প্রতিদিন রাত ১২টায় অটোমেটিক রান হবে
    - cron: "0 0 * * *"
  
  # আপনি চাইলে Actions ট্যাব থেকে ম্যানুয়ালিও রান করতে পারবেন
  workflow_dispatch:
  
  # মেইন ব্রাঞ্চে কোনো পুশ হলে রান হবে
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # ১. সাপের অ্যানিমেশন তৈরি করা
      - name: generate-snake-game-from-github-contribution-grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # ২. অ্যানিমেশনটি 'output' ব্রাঞ্চে পুশ করা
      - name: push-snake-animation-to-output-branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
